name: Verify release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Public source audit
        run: python scripts/audit_public.py
      - name: Backend and audit tests
        run: |
          python -m unittest discover -s tests/backend -v
          python -m unittest discover -s tests/audit -v
      - name: Frontend syntax
        shell: bash
        run: |
          for file in web/*.js scripts/*.cjs; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
