name: Verify Shijie
on:
  push:
    paths:
      - 'apps/shijie/**'
      - 'scripts/audit_public.py'
      - 'tests/audit/**'
      - '.github/workflows/shijie.yml'
  pull_request:
    paths:
      - 'apps/shijie/**'
      - 'scripts/audit_public.py'
      - 'tests/audit/**'
      - '.github/workflows/shijie.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Public source audit
        run: python scripts/audit_public.py
      - name: Audit policy regression
        run: python -m unittest discover -s tests/audit -v
      - name: Shijie backend and original Python example
        working-directory: apps/shijie
        run: |
          python -m unittest discover -s tests/backend -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s examples/python-notes/project -v
      - name: Offline storage contract
        working-directory: apps/shijie
        run: node --test tests/offline/store-contract.test.cjs
      - name: Frontend syntax
        working-directory: apps/shijie
        run: |
          Get-ChildItem web/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
